# 定時更新首頁資料（天氣、股票、匯率），結果存成 data/home.json
# 時間是 UTC，台灣時間要 +8 小時。GitHub 的排程常會晚 5–20 分鐘才跑。
name: 更新首頁資料

on:
  schedule:
    - cron: "7,37 1-5 * * 1-5"      # 週一到週五 09:07–13:37，每 30 分鐘（盤中）
    - cron: "17 22,4,10,14 * * *"   # 每天 06:17、12:17、18:17、22:17（天氣、收盤、匯率）
  workflow_dispatch:                # 也可以在 Actions 頁面手動按「Run workflow」

permissions:
  contents: write

concurrency:
  group: update-home
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4

      - name: 抓資料
        shell: pwsh
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: ./scripts/build.ps1

      - name: 存檔
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/home.json
          if git diff --cached --quiet; then echo "資料沒有變化"; exit 0; fi
          git commit -m "更新首頁資料"
          git push

      - name: 清除 jsDelivr 快取
        run: curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/data/home.json" || true
